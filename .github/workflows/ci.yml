name: ci
on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.clients.label }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        clients:
          - { redis: '^5', ioredis: '^5', label: 'redis5-ioredis5' }
          - { redis: '^6', ioredis: '^6', label: 'redis6-ioredis6' }

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Install matrix client versions
        run: npm install --no-save redis@${{ matrix.clients.redis }} ioredis@${{ matrix.clients.ioredis }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build
        run: npm install && npm run build

      - name: Publish
        run: |
          npm set registry "https://registry.npmjs.org"
          npm set //registry.npmjs.org/:_authToken ${{ secrets.NPM_PUBLISH_TOKEN }}
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
