services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Ephemeral: no persistence, tests start from a clean store
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
